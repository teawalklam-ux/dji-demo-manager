name: Repository privacy check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan committed files without printing sensitive values
        run: node scripts/security-scan.mjs --history
      - name: Verify scanner behavior
        run: node --test tests/security-scan.test.ts
